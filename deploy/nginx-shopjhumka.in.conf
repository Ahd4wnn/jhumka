# Reference copy of /etc/nginx/sites-available/shopjhumka.in.conf, BEFORE certbot edits it.
# certbot adds the `listen 443 ssl`, the certificate paths and the HTTP→HTTPS redirect itself:
#   certbot --nginx -d shopjhumka.in -d www.shopjhumka.in
# Never overwrite the live file wholesale afterwards — that removes certbot's HTTPS block.
# To reinstate it after an edit: certbot install --nginx --cert-name shopjhumka.in --redirect

server {
    listen 80;
    listen [::]:80;
    server_name shopjhumka.in *.shopjhumka.in;

    # Customers upload review photos (up to 4, ~12 MB each).
    client_max_body_size 25m;

    # Product and review photos, served straight from disk.
    location /media/ {
        alias /var/lib/jhumka/media/;
        types { image/avif avif; image/webp webp; }
        default_type application/octet-stream;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Live order alerts in the admin (server-sent events): no buffering.
    location /api/admin/events {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
